# /etc/rsyslog.conf minimal configuration file for rsyslog in container
#
# imklog is intentionally not loaded -- it requires /proc/kmsg which is
# not accessible in unprivileged containers.

#################
#### MODULES ####
#################

module(load="imuxsock") # provides support for local system logging

###########################
#### GLOBAL DIRECTIVES ####
###########################

# Filter duplicated messages
$RepeatedMsgReduction on

$ActionSendStreamDriverMode 1
$ActionSendStreamDriverAuthMode anon

$FileOwner root
$FileGroup adm
$FileCreateMode 0640
$DirCreateMode 0755
$Umask 0022

$MaxMessageSize 65536

# Log forwarding (TCP)
# local1: application + audit logs
# local2: access logs (uvicorn request log)
local1.* action(
  type="omfwd"
  target="deriva-logging"
  port="514"
  protocol="tcp"
  action.resumeRetryCount="-1"
  queue.type="linkedList"
  queue.size="10000"
)
local2.* action(
  type="omfwd"
  target="deriva-logging"
  port="514"
  protocol="tcp"
  action.resumeRetryCount="-1"
  queue.type="linkedList"
  queue.size="10000"
)

$WorkDirectory /var/spool/rsyslog
$IncludeConfig /etc/rsyslog.d/*.conf